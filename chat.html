<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CUBMessenger — мессенджер</title>
  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>

  <style>
    :root{--bg:#f2f6fb;--panel:#fff;--muted:#6b7280;--accent:#2b8cff;--accent-2:#36c76f;--bubble-self:#dbeafe;--bubble-other:#fff;--glass:rgba(16,24,40,0.04);--radius:14px;--shadow:0 6px 18px rgba(18,20,22,0.06)}
    [data-theme='dark']{--bg:#071022;--panel:#071421;--muted:#9aa4b2;--accent:#4f63f5;--accent-2:#57f287;--bubble-self:#0f2b45;--bubble-other:#071421;--glass:rgba(255,255,255,0.03);--shadow:0 6px 18px rgba(0,0,0,0.6)}
    *{box-sizing:border-box;font-family:Inter,Segoe UI,Roboto,Arial}
    html,body{height:100%;margin:0;background:var(--bg)}
    .app{display:grid;grid-template-columns:320px 1fr 320px;gap:16px;height:100vh;padding:16px}
    .panel{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
    .left{padding:10px}
    .brand{display:flex;align-items:center;gap:10px;padding:12px}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    .search{padding:8px}
    .search input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass);background:transparent}
    .sectionTitle{font-size:12px;color:var(--muted);padding:8px 6px}
    .list{overflow:auto;padding:6px}
    .item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
    .item:hover{background:var(--glass)}
    .item.active{background:linear-gradient(90deg,rgba(43,140,255,0.12),rgba(54,199,111,0.06))}
    .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
    .meta{flex:1;min-width:0}
    .meta .title{font-weight:700}
    .meta .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .center{display:flex;flex-direction:column}
    .chatHeader{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--glass)}
    .chatHeader .title{font-weight:700}
    .messages{flex:1;padding:18px;overflow:auto;background:linear-gradient(to bottom, transparent, rgba(0,0,0,0.02));display:flex;flex-direction:column;gap:12px}
    .bubble{max-width:72%;padding:12px;border-radius:12px;position:relative;word-wrap:break-word}
    .bubble.me{margin-left:auto;background:var(--bubble-self);border-bottom-right-radius:6px}
    .bubble.them{background:var(--bubble-other);border-bottom-left-radius:6px}
    .metaRow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .time{font-size:11px;color:var(--muted)}
    .composer{padding:12px;border-top:1px solid var(--glass);display:flex;gap:10px;align-items:center}
    .composer textarea{flex:1;padding:12px;border-radius:12px;border:1px solid var(--glass);resize:none;min-height:48px}
    .btn{padding:10px 12px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
    .btn.secondary{background:transparent;border:1px solid var(--glass);color:var(--muted)}
    .right{padding:12px}
    .profileCard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px}
    .small{font-size:13px;color:var(--muted)}
    .controls{display:flex;gap:8px;margin-top:8px}
    .reactions{display:flex;gap:6px;margin-top:8px}
    .reaction{padding:6px 8px;border-radius:999px;background:var(--glass);font-size:13px;cursor:pointer}
    .channelBadge{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--glass);display:inline-block;margin-right:6px}
    .settings{padding:12px;border-top:1px solid var(--glass)}
    .toggle{display:inline-flex;align-items:center;gap:8px}
    @media (max-width:1000px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.left,.right{display:none}}
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <div class="panel left">
      <div class="brand"><div class="logo">CM</div><div><div style="font-weight:800">CUBMessenger</div><div class="small">Быстро. Надёжно. Просто</div></div></div>
      <div class="search"><input id="globalSearch" placeholder="Поиск: юзернеймы, каналы..." /></div>
      <div class="sectionTitle">Каналы</div>
      <div class="list" id="channelsList"></div>
      <div class="sectionTitle">Чаты</div>
      <div class="list" id="dialogsList"></div>
      <div style="padding:12px;border-top:1px solid var(--glass);display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="display:flex;gap:8px;align-items:center">
          <div id="miniAvatar" class="avatar" style="width:36px;height:36px;border-radius:8px">G</div>
          <div><div id="miniName">Гость</div><div class="small" id="miniEmail">не в сети</div></div>
        </div>
        <div>
          <button id="authBtn" class="btn">Войти через Gmail</button>
        </div>
      </div>
    </div>

    <div class="panel center">
      <div class="chatHeader"><div class="avatar" id="chatAvatar" style="width:46px;height:46px;border-radius:8px">#</div><div style="flex:1;min-width:0"><div class="title" id="chatTitle"># общий</div><div class="small" id="chatSubtitle">Канал для всех</div></div><div class="controls"><button class="btn secondary" id="themeToggle">Тема</button><button class="btn secondary" id="newChannelBtn">Новый канал</button></div></div>
      <div class="messages" id="messages"></div>
      <div class="composer"><input type="file" id="attach" style="display:none" /><textarea id="messageInput" placeholder="Напиши сообщение... (Enter — отправить)"></textarea><button class="btn" id="sendBtn">Отправить</button></div>
    </div>

    <div class="panel right">
      <div style="padding:12px">
        <div class="profileCard"><div class="avatar" id="profileAvatar" style="width:64px;height:64px;border-radius:12px">G</div><div><div id="profileName" style="font-weight:700">Гость</div><div class="small" id="profileEmail">—</div><div class="small">ID: <span id="profileUid">—</span></div></div></div>
        <div style="margin-top:12px"><div class="small">Участники</div><div id="members" style="margin-top:8px;display:flex;flex-direction:column;gap:8px;max-height:200px;overflow:auto"></div></div>
        <div class="settings"><div class="small">Настройки</div><div style="margin-top:8px;display:flex;flex-direction:column;gap:8px"><label class="toggle"><input type="checkbox" id="notifToggle" checked /> Включить уведомления браузера</label><label class="toggle"><input type="checkbox" id="soundToggle" checked /> Звуковые уведомления</label><label class="toggle"><input type="checkbox" id="desktopBadge" /> Показывать бейдж непрочитанных</label></div></div>
      </div>
    </div>
  </div>

  <script>
    // ---------- Firebase config ----------
    const firebaseConfig = {apiKey: "AIzaSyD4nihThuuSCe8097EQSdSQeoklIGxxS0o",authDomain: "mychat-34e4c.firebaseapp.com",databaseURL: "https://mychat-34e4c-default-rtdb.firebaseio.com",projectId: "mychat-34e4c",storageBucket: "mychat-34e4c.appspot.com",messagingSenderId: "125602835573",appId: "1:125602835573:web:ecfc9faa66957a8d055c3c"};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    // ---------- State ----------
    let me = {name:'Гость', uid:null, email:null};
    let current = {type:'channel', id:'общий'};
    let msgListener = null;
    let unreadCounts = {};

    // ---------- UI refs ----------
    const channelsList = document.getElementById('channelsList');
    const dialogsList = document.getElementById('dialogsList');
    const messagesEl = document.getElementById('messages');
    const membersEl = document.getElementById('members');
    const authBtn = document.getElementById('authBtn');
    const sendBtn = document.getElementById('sendBtn');
    const input = document.getElementById('messageInput');
    const notifToggle = document.getElementById('notifToggle');
    const soundToggle = document.getElementById('soundToggle');

    // ---------- Helpers ----------
    function initials(name){ return name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
    function avatarColor(name){ const colors=['#2b8cff','#36c76f','#f59e0b','#ef4444','#7c3aed']; let h=0; for(let i=0;i<name.length;i++) h = name.charCodeAt(i)+((h<<5)-h); return colors[Math.abs(h)%colors.length]; }
    function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ---------- Ensure default channels ----------
    const defaultChannels = ['общий','новости','разговоры'];
    function ensureChannels(){ defaultChannels.forEach(c=> db.ref('channels/'+c).once('value').then(s=>{ if(!s.exists()) db.ref('channels/'+c).set({name:c,created:Date.now()}); })); }
    ensureChannels();

    // ---------- Render channels and users (efficient) ----------
    db.ref('channels').on('value', snap=>{ renderChannels(snap); });
    function renderChannels(snap){ channelsList.innerHTML=''; snap.forEach(s=>{ const c = s.val(); const el=document.createElement('div'); el.className='item'+(c.name===current.id?' active':''); el.innerHTML=`<div class='avatar' style='background:linear-gradient(90deg,var(--accent),var(--accent-2))'>#</div><div class='meta'><div class='title'># ${c.name}</div><div class='sub'>Канал</div></div>`; el.onclick=()=>openChannel(c.name); channelsList.appendChild(el); }); }

    // Users list and presence
    db.ref('users').on('value', snap=>{ const users = snap.val()||{}; renderDialogs(users); renderMembers(users); updateUnreadBadge(users); });

    function renderDialogs(users){ dialogsList.innerHTML=''; const arr = Object.values(users).filter(u=>u && u.name !== me.name); arr.sort((a,b)=> (b.lastSeen||0)-(a.lastSeen||0)); arr.forEach(u=>{ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class='avatar' style='background:${avatarColor(u.name)}'>${initials(u.name)}</div><div class='meta'><div class='title'>${u.name}</div><div class='sub'>${u.email||'—'}</div></div>`; el.onclick=()=>openDM(u.name); dialogsList.appendChild(el); }); }

    function renderMembers(users){ membersEl.innerHTML=''; Object.values(users||{}).forEach(u=>{ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class='avatar' style='background:${avatarColor(u.name)}'>${initials(u.name)}</div><div class='meta'><div class='title'>${u.name}</div><div class='sub'>${u.online? 'online':'offline'}</div></div>`; membersEl.appendChild(el); }); }

    // ---------- Open channel / DM ----------
    function openChannel(name){ setCurrent({type:'channel', id:name}); }
    function openDM(userName){ const dmId = [me.name,userName].sort().join('_'); setCurrent({type:'dm', id:dmId, peer:userName}); }

    function setCurrent(obj){ // detach, clear, attach
      if(msgListener) db.ref('messages').off('child_added', msgListener);
      current = obj; document.getElementById('chatTitle').textContent = current.type==='channel'? ('# '+current.id) : current.peer; document.getElementById('chatAvatar').textContent = current.type==='channel'? '#': (current.peer? current.peer.charAt(0).toUpperCase() : '?'); document.getElementById('channelTags').textContent = current.type==='channel'? ('#'+current.id) : 'ЛС'; messagesEl.innerHTML=''; loadMessages(); }

    // ---------- Load and subscribe messages (optimized) ----------
    function loadMessages(){ messagesEl.innerHTML=''; // load last 200 only for this channel/dm
      db.ref('messages').orderByChild('time').limitToLast(1000).once('value').then(snap=>{
        const msgs = []; snap.forEach(ch=>{ const m=ch.val(); m.key=ch.key; msgs.push(m); }); msgs.sort((a,b)=>a.time-b.time); msgs.forEach(m=>{ if(matchesCurrent(m)) renderMessage(m); }); subscribeMessages(); messagesEl.scrollTop = messagesEl.scrollHeight; }); }

    function subscribeMessages(){ msgListener = snap=>{ const m = snap.val(); m.key=snap.key; if(matchesCurrent(m)) { renderMessage(m); notifyIfNeeded(m); } }; db.ref('messages').on('child_added', msgListener); }
    function matchesCurrent(m){ if(current.type==='channel') return m.channel===current.id; if(current.type==='dm') return m.dm===current.id; return false; }

    // ---------- Render a message ----------
    function renderMessage(m){ const meClass = (m.user===me.name)? 'me':'them'; const b=document.createElement('div'); b.className='bubble '+meClass; b.innerHTML = `<div class='metaRow'><strong>${escapeHtml(m.user)}</strong><div class='time'>${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div><div>${escapeHtml(m.text)}</div>`; // reactions
      const rx=document.createElement('div'); rx.className='reactions'; ['👍','❤️','😂'].forEach(r=>{ const btn=document.createElement('div'); btn.className='reaction'; btn.innerText=r; btn.onclick=()=>toggleReaction(m.key,r); rx.appendChild(btn); }); b.appendChild(rx); messagesEl.appendChild(b); messagesEl.scrollTop = messagesEl.scrollHeight; }

    function toggleReaction(msgId, emoji){ if(!me.uid) return alert('Войдите чтобы ставить реакции'); const ref = db.ref('reactions/'+msgId+'/'+me.uid); ref.once('value').then(s=>{ if(s.exists() && s.val()===emoji) ref.remove(); else ref.set(emoji); }); }

    // ---------- Send message ----------
    sendBtn.onclick = sendMessage; input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
    function sendMessage(){ const text = input.value.trim(); if(!text) return; if(!me.uid) return alert('Пожалуйста, войдите через Gmail чтобы отправлять сообщения'); const payload = { user: me.name, uid: me.uid, text, time: Date.now(), channel: current.type==='channel'? current.id : null, dm: current.type==='dm'? current.id : null }; db.ref('messages').push(payload).then(()=>{ input.value=''; updateReadState(); }); }

    // ---------- Notifications ----------
    function requestNotificationPermission(){ if('Notification' in window){ Notification.requestPermission().then(p=>{ console.log('Notification permission', p); }); } }
    function notifyIfNeeded(m){ if(!m || !me.uid) return; if(!notifToggle.checked) return; // don't notify for own messages
      if(m.user === me.name) return; const title = current.type==='channel'? ('#'+current.id) : (current.peer||'Сообщение'); const body = m.text.length>120? m.text.slice(0,120)+'...': m.text; if(document.hidden){ if(Notification.permission==='granted'){ const n = new Notification(title, {body, icon: ''}); setTimeout(()=>n.close(),5000); } if(soundToggle.checked){ playPing(); } // increment unread
        incrementUnreadFor(current.id); }
    }

    function playPing(){ try{ const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/250/250-preview.mp3'); audio.play(); }catch(e){console.log('sound err',e);} }

    // ---------- Unread counters (basic) ----------
    function incrementUnreadFor(id){ unreadCounts[id] = (unreadCounts[id]||0)+1; renderUnreadBadges(); }
    function clearUnreadFor(id){ unreadCounts[id]=0; renderUnreadBadges(); }
    function renderUnreadBadges(){ // place simple badges next to channels and dialogs
      // rebuild lists (cheap but simple)
      db.ref('channels').once('value').then(snap=>{ channelsList.innerHTML=''; snap.forEach(s=>{ const c=s.val(); const id=c.name; const el=document.createElement('div'); el.className='item'+(current.type==='channel' && current.id===id? ' active':''); el.innerHTML=`<div class='avatar' style='background:linear-gradient(90deg,var(--accent),var(--accent-2))'>#</div><div class='meta'><div class='title'># ${c.name}</div><div class='sub'>Канал</div></div>`; el.onclick=()=>{ openChannel(id); clearUnreadFor(id); }; if(unreadCounts[id]){ const badge=document.createElement('div'); badge.style.marginLeft='8px'; badge.style.padding='4px 6px'; badge.style.background='var(--accent)'; badge.style.color='white'; badge.style.borderRadius='12px'; badge.style.fontSize='12px'; badge.textContent=unreadCounts[id]; el.appendChild(badge); } channelsList.appendChild(el); }); });
      db.ref('users').once('value').then(snap=>{ dialogsList.innerHTML=''; const vals = snap.val()||{}; Object.values(vals).forEach(u=>{ if(u.name===me.name) return; const id=[me.name,u.name].sort().join('_'); const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class='avatar' style='background:${avatarColor(u.name)}'>${initials(u.name)}</div><div class='meta'><div class='title'>${u.name}</div><div class='sub'>${u.email||''}</div></div>`; el.onclick=()=>{ openDM(u.name); clearUnreadFor(id); }; if(unreadCounts[id]){ const badge=document.createElement('div'); badge.style.marginLeft='8px'; badge.style.padding='4px 6px'; badge.style.background='var(--accent)'; badge.style.color='white'; badge.style.borderRadius='12px'; badge.style.fontSize='12px'; badge.textContent=unreadCounts[id]; el.appendChild(badge); } dialogsList.appendChild(el); }); }); }

    // When window becomes visible, clear unread for current
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(current) clearUnreadFor(current.type==='channel'? current.id : current.id); } });

    // ---------- Auth (Google) robust ----------
    authBtn.onclick = ()=>{ if(auth.currentUser){ auth.signOut(); } else { const provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(provider).catch(err=>alert('Ошибка входа: '+err.message)); } };
    auth.onAuthStateChanged(user=>{ if(user){ me = {name: user.displayName || user.email.split('@')[0], uid: user.uid, email: user.email}; // write to users node with presence
        const userRef = db.ref('users/'+me.uid);
        userRef.update({name:me.name,email:me.email,online:true,lastSeen:Date.now()});
        // on disconnect
        userRef.onDisconnect().update({online:false,lastSeen:Date.now()});
        // ui
        document.getElementById('miniAvatar').textContent = initials(me.name); document.getElementById('miniAvatar').style.background = avatarColor(me.name);
        document.getElementById('miniName').textContent = me.name; document.getElementById('miniEmail').textContent = me.email;
        document.getElementById('profileName').textContent = me.name; document.getElementById('profileEmail').textContent = me.email; document.getElementById('profileUid').textContent = me.uid;
        authBtn.textContent = 'Выйти'; requestNotificationPermission();
      } else { me = {name:'Гость', uid:null, email:null}; document.getElementById('miniAvatar').textContent = 'G'; document.getElementById('miniAvatar').style.background = '#999'; document.getElementById('miniName').textContent = 'Гость'; document.getElementById('miniEmail').textContent = 'не в сети'; document.getElementById('profileName').textContent = 'Гость'; document.getElementById('profileEmail').textContent = '—'; document.getElementById('profileUid').textContent = '—'; authBtn.textContent = 'Войти через Gmail'; } });

    // ---------- Search ----------
    document.getElementById('globalSearch').addEventListener('input', e=>{ const q = e.target.value.toLowerCase(); db.ref('channels').once('value').then(snap=>{ channelsList.innerHTML=''; snap.forEach(ch=>{ const c=ch.val(); if(c.name.toLowerCase().includes(q) || q===''){ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class='avatar' style='background:linear-gradient(90deg,var(--accent),var(--accent-2))'>#</div><div class='meta'><div class='title'># ${c.name}</div><div class='sub'>Канал</div></div>`; el.onclick=()=>openChannel(c.name); channelsList.appendChild(el); } }); }); db.ref('users').once('value').then(snap=>{ dialogsList.innerHTML=''; const vals = snap.val()||{}; Object.values(vals).forEach(u=>{ if(u.name.toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q) || q===''){ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class='avatar' style='background:${avatarColor(u.name)}'>${initials(u.name)}</div><div class='meta'><div class='title'>${u.name}</div><div class='sub'>${u.email||''}</div></div>`; el.onclick=()=>openDM(u.name); dialogsList.appendChild(el); } }); }); });

    // ---------- New channel ----------
    document.getElementById('newChannelBtn').onclick = ()=>{ if(!me.uid) return alert('Только для авторизованных'); const name = prompt('Имя канала (латиница/кириллица, без пробелов)'); if(!name) return; db.ref('channels/'+name).set({name,created:Date.now(),creator:me.uid}); };

    // ---------- Theme toggle ----------
    const themeToggle = document.getElementById('themeToggle'); themeToggle.onclick = ()=>{ const cur = document.body.getAttribute('data-theme'); const next = cur==='light'? 'dark' : 'light'; document.body.setAttribute('data-theme', next); localStorage.setItem('theme', next); }; (function(){ const t = localStorage.getItem('theme')||'light'; document.body.setAttribute('data-theme', t); })();

    // ---------- Presence cleanup ----------
    window.addEventListener('beforeunload', ()=>{ if(me.uid) db.ref('users/'+me.uid).update({online:false,lastSeen:Date.now()}); });

    // ---------- Simple typing indicator (per-channel) ----------
    let typingTimeout = null; input.addEventListener('input', ()=>{ if(!me.uid) return; const path = current.type==='channel'? ('typing/'+current.id+'/'+me.uid) : ('typing/'+current.id+'/'+me.uid); db.ref(path).set({name:me.name,ts:Date.now()}); if(typingTimeout) clearTimeout(typingTimeout); typingTimeout = setTimeout(()=>{ db.ref(path).remove(); },2500); });

    // show typing
    function subscribeTyping(){ if(!current) return; const path = 'typing/'+current.id; db.ref(path).on('value', snap=>{ const v = snap.val()||{}; const others = Object.values(v).filter(x=> x.name !== me.name); const subtitle = others.length? (others.map(o=>o.name).slice(0,3).join(', ')+' печатает...') : (current.type==='channel'? 'Канал' : 'ЛС'); document.getElementById('chatSubtitle').textContent = subtitle; }); }

    // ---------- Notifications permission on load ----------
    if('Notification' in window && Notification.permission==='default'){ requestNotificationPermission(); }

    // ---------- Notify for incoming message when not focused ----------
    function notifyGlobal(m){ if(!notifToggle.checked) return; if(m.user===me.name) return; if(Notification.permission==='granted'){ const title = m.user; const body = m.text; const n = new Notification(title, {body}); setTimeout(()=>n.close(),5000); } if(soundToggle.checked) playPing(); }

    // Use notifyIfNeeded within subscribeMessages
    function notifyIfNeeded(m){ // called only for messages matching current
      // If user is not focused or viewing different chat -> show global
      if(document.hidden || !matchesCurrent(m)) { notifyGlobal(m); // unread
        const idKey = m.channel || m.dm; incrementUnreadFor(idKey); renderUnreadBadges(); }
    }

    // ---------- Efficient unread update when user switches ----------
    function updateReadState(){ if(!me.uid) return; const idKey = current.type==='channel'? current.id : current.id; db.ref('read/'+(me.uid)+'/'+idKey).set(Date.now()); clearUnreadFor(idKey); }

    // ---------- Load initial messages and subscribe typing when switching ----------
    // Wrap original setCurrent to also subscribe typing
    const origSetCurrent = setCurrent; setCurrent = function(obj){ if(msgListener) db.ref('messages').off('child_added', msgListener); if(current) db.ref('typing/'+(current.id||'')).off(); current=obj; document.getElementById('chatTitle').textContent = current.type==='channel'? ('# '+current.id) : current.peer; document.getElementById('chatAvatar').textContent = current.type==='channel'? '#': (current.peer? current.peer.charAt(0).toUpperCase() : '?'); document.getElementById('channelTags').textContent = current.type==='channel'? ('#'+current.id) : 'ЛС'; messagesEl.innerHTML=''; loadMessages(); subscribeTyping(); clearUnreadFor(current.id); updateReadState(); };

    // Initialize UI
    openChannel('общий');

    // Small performance note: use limitToLast, detach listeners when not needed to avoid lag.

  </script>
